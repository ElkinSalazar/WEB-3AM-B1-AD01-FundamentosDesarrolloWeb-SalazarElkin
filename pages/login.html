
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoCare | Iniciar sesión</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="../index.html">AutoCare</a>

            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse" data-bs-target="#menuPrincipal"
                    aria-controls="menuPrincipal" aria-expanded="false"
                    aria-label="Abrir menú">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menuPrincipal">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="../index.html">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="acerca.html">Nosotros</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="servicios.html">Servicios</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="registro.html">Registrarse</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="login.html">Iniciar sesión</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-5">

        <div class="form-container login-container mx-auto">

            <div class="text-center mb-4">
                <h1 class="fw-bold">Bienvenido a AutoCare</h1>
                <p class="text-secondary">
                    Ingresa tus credenciales para continuar.
                </p>
            </div>

            <form id="formLogin" novalidate>

                <div class="mb-3">
                    <label for="usuario" class="form-label">
                        Usuario
                    </label>
                    <input type="text" class="form-control"
                           id="usuario" name="usuario"
                           placeholder="Ingresa tu usuario"
                           minlength="4" maxlength="20"
                           autocomplete="username" required>
                    <div class="invalid-feedback"></div>
                </div>

                <div class="mb-4">
                    <label for="contrasena" class="form-label">
                        Contraseña
                    </label>
                    <input type="password" class="form-control"
                           id="contrasena" name="contrasena"
                           placeholder="Ingresa tu contraseña"
                           maxlength="30"
                           autocomplete="current-password" required>
                    <div class="invalid-feedback"></div>
                </div>

                <button type="submit" class="btn btn-primary w-100">
                    Iniciar sesión
                </button>

                <p class="text-center mt-4 mb-0">
                    ¿No tienes una cuenta?
                    <a href="registro.html">Regístrate aquí</a>
                </p>

            </form>

        </div>

    </main>

    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <p class="mb-0">
            © 2026 AutoCare - Todos los derechos reservados.
        </p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.14.5/dist/sweetalert2.all.min.js"></script>
    <script src="../js/script.js"></script>

</body>
</html>
